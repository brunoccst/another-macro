# The Phantom Crystal Dimension, with the White Key an Another Dungeon run can drop:
# every chest and paw-stamp cat of every world, then on through a portal, until the Cape or
# the final world ends it. Start it next to the shining Another Dungeon door (Spacetime Rift),
# or inside the dimension. In the Last World and the World's Cape it stops after the chests, before the Sensationalist (you talk to them and pick the free Treatise/Codex/Opus) and the way out.
name: phantom-crystal
group: dungeon
icon: crystal
description: "Phantom Crystal Dimension (White Key): every chest and stamp, world by world."
templates: [another_dungeon]
params: {}
screens: [field]
unknown_timeout_s: 120
handlers:
  field: [{phantom_crystal: true}]
unknown:
  - wait: 2
