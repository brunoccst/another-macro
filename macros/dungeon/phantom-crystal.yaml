# The Phantom Crystal Dimension, with the White Key an Another Dungeon run can drop:
# every chest and paw-stamp cat of every world, then on through a portal, until the Cape or
# the final world ends it. Start it anywhere on the field (go_to_door: it travels to the Spacetime Rift
# and walks to the shining Another Dungeon door), next to that door, or inside the dimension. In the Last World it stops after the chests, before the Sensationalist (you talk to them and pick
# the free Treatise/Codex/Opus) and the way out. In the World's Cape it stops the same way only when the Sensationalist is
# there (their "!" next to the cat's); otherwise it takes the stairs out.
name: phantom-crystal
group: dungeon
icon: crystal
description: "Phantom Crystal Dimension (White Key): every chest and stamp, world by world."
templates: [another_dungeon]
params:
  go_to_door: {default: true, type: bool, help: "start anywhere on the field: the macro opens the World Map's \"???\" tab, travels to the Spacetime Rift and walks to the Another Dungeon door by itself; off = start it next to the door (or inside the dimension)"}
screens: [field]
unknown_timeout_s: 120
handlers:
  field: [{phantom_crystal: true}]
unknown:
  - wait: 2
# Fixed routes, one per world, picked by the world's title banner (`title`: its words after
# "Phantom Crystal Dimension"); each `route` starts where the party arrives. Steps: `L 1200` /
# `R 1200` hold left/right that many ms from rest, `U` / `D` flick up/down, `wait 1.5`,
# `chest x y` / `cat x y` tap the "!" nearest that screen spot (x, y fractions; without them the
# "!" nearest the middle), `portal x y` the way on, `stairs x y` the stairs out of the dimension,
# `sensationalist` look for the Sensationalist's "!" here (the run stops for you if it shows),
# `moves_on` wait for the world to move on by itself. A world with no route here, or a route
# whose "!" doesn't show, is looked around in short steps instead (the run's outcome then says
# so: LOOKED AROUND ...); the log has a "route draft for world ..." line to check and copy here.
worlds: []
