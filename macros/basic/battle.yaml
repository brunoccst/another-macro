# Basic macro: fight the battle on screen to its end, with a skill per party slot.
# Every battle goes through it: grind-battles runs it for each encounter, the cat routine for
# encounters on its way; the Another Dungeon fights use the same step with these skills (the
# boss with the dungeon's own boss skills, when set). Every macro that runs it takes these options
# over as its own (battle.skill_1..4, starting from the values set here), so each can fight its own way.
# Each skill starts as "global": the Global parameters' skill (System → Settings), until set here
# or on the macro that runs it.
name: battle
group: basic
icon: swords
description: "Basic: fight the battle on screen to its end, with a skill per party slot (all auto = plain Attack every turn). Never touches the battle speed. Every battle uses it."
params:
  # the four front-row party slots, left to right; all auto = plain Attack every turn; global = the Global parameters' skill
  skill_1: {global: skill_1, choices: [auto, 1, 2, 3, 4], help: "party slot 1 (front row, left): auto or skill 1-4 (4 = the last skill)"}
  skill_2: {global: skill_2, choices: [auto, 1, 2, 3, 4], help: "party slot 2: auto or skill 1-4"}
  skill_3: {global: skill_3, choices: [auto, 1, 2, 3, 4], help: "party slot 3: auto or skill 1-4"}
  skill_4: {global: skill_4, choices: [auto, 1, 2, 3, 4], help: "party slot 4: auto or skill 1-4"}
screens: [defeat, battle_result, skill_list, battle_command, battle, field]
unknown_timeout_s: 30

handlers:
  # the whole battle is one step: the chosen skills on the first turn (the game keeps them), Attack every turn
  battle_command: &fight
    - fight: skill_
    - stop: "{outcome}"     # won / none (a defeat stops with "party was defeated")
  skill_list: *fight
  battle: *fight
  battle_result: *fight

  defeat:
    - stop: party was defeated

  field:
    - stop: none            # no battle on screen

unknown:
  # a battle's intro: look again
  - wait: 0.5
