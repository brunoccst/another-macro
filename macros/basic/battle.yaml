# Basic macro: fight the battle on screen to its end, with a skill per party slot.
# Every battle goes through it: grind-battles runs it for each encounter, the cat routine for
# encounters on its way; the Another Dungeon fights use the same step with these skills (the
# boss with the dungeon's own boss skills, when set). Set the skills once, here.
name: battle
group: basic
icon: swords
description: "Basic: fight the battle on screen to its end, with a skill per party slot (all auto = the Auto button). Every battle uses it."
params:
  # the four front-row party slots, left to right; all auto = the battle's Auto button
  skill_1: {default: auto, choices: [auto, 1, 2, 3, 4], help: "party slot 1 (front row, left): auto or skill 1-4 (4 = the last skill)"}
  skill_2: {default: auto, choices: [auto, 1, 2, 3, 4], help: "party slot 2: auto or skill 1-4"}
  skill_3: {default: auto, choices: [auto, 1, 2, 3, 4], help: "party slot 3: auto or skill 1-4"}
  skill_4: {default: auto, choices: [auto, 1, 2, 3, 4], help: "party slot 4: auto or skill 1-4"}
screens: [defeat, battle_result, skill_list, battle_command, battle, field]
unknown_timeout_s: 30

handlers:
  # the whole battle is one step: the chosen skills on the first turn (the game keeps them), Attack every turn
  battle_command: &fight
    - fight: skill_
    - stop: "{outcome}"     # won / none (a defeat stops with "party was defeated")
  skill_list: *fight
  battle: *fight
  battle_result: *fight

  defeat:
    - stop: party was defeated

  field:
    - stop: none            # no battle on screen

unknown:
  # a battle's intro: look again
  - wait: 0.5
