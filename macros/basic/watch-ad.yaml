# Basic macro: watch the commercial that was just started, close it, take its reward.
# Other macros run it right after tapping a "watch" button (`run: watch-ad`), then go on:
#   - while the commercial plays (nothing of the game on screen): wait until it shows
#     "Reward granted" (the ad's own sign that it counted) and press Back then; without that
#     sign, press Back once its own signs say it is over: its progress bar full, its countdown
#     ("Reward in 12 seconds") done, or its picture still (the end card) for still_s after at
#     least min_watch_s; else after ad_wait_s press Back, again every retry_s if it doesn't close.
#     Such an early Back is never counted toward leaving it: commercials ignore Back until they
#     count, and if one warns "Close video? You will lose your reward", Back answers it (keep
#     watching) and only the timer closes that commercial
#   - one watch can be a group of 1 to 3 commercials in a row: each one is closed the same way
#     (backs and the timer start again for the next), until the game's reward shows
#   - the game's own screen back after the commercials (the app sees the ad's activity go):
#     stop, so the caller opens its chest / goes on; never press Back on the game's screens
#   - the field (the commercials closed straight back to the game, seen for field_s): stop; never press Back on
#     the field ("Close the app?"), and if that dialog shows anyway, answer No
#   - the game's reward dialog (or the premium thank-you): tap OK / Close and stop
#   - the caller's own screen back (its `until:`): stop there
#   - a commercial that opens a Google Play app sheet by itself: Back closes the
#     sheet (never tap anything in Play: no installs, no purchases), then the usual Backs close the
#     commercial behind it
#   - a commercial that won't close (a playable one with no X, not even on its end card, and Back
#     ignored): after leave_after Backs, leave it once: Home, then the game's own screen (leave_ad;
#     the game carries on, the reward is usually lost). Still there after that (some come straight
#     back and play again): force-close the game from recent apps (force_close) and stop with
#     "force-closed the game, a commercial did not close"; the caller starts the game again
#   - no commercial at all (none to show, so the game goes straight to its reward): once the
#     game's own screen has been in front for no_ad_s with no commercial seen, stop, so the
#     caller opens the chest (pressing Back there would throw the chest away)
# Never taps inside a commercial (never its "Play Now", never a store page): only Back closes it.
name: watch-ad
group: basic
icon: chest
description: "Basic: watch the commercial that just started, close it and take the reward. Other macros run it after tapping a watch button."
templates: [start_game, daily_ads]
params:
  ad_wait_s: {default: 45, help: "how long to let a commercial play before pressing Back to close it"}
  retry_s: {default: 15, help: "after a Back that didn't end it (or the next commercial in a row), press Back again after this long"}
  max_backs: {default: 10, help: "give up after this many Backs (a group of up to 3 commercials takes a few each)"}
  field_s: {default: 5, help: "stop once the field has shown this long (a short field between two commercials of a group doesn't count)"}
  max_play: {default: 6, help: "give up after closing this many Google Play sheets"}
  no_ad_s: {default: 10, help: "no commercial seen and the game's own screen on this long: there was no commercial, stop (the caller opens the chest)"}
  leave_after: {default: 4, help: "a commercial still on after this many Backs (no close button): leave it with Home and go back to the game"}
  early_close: {default: true, help: "close a commercial as soon as it shows it is over (its progress bar full, its countdown done, its end card up), instead of waiting ad_wait_s"}
  still_s: {default: 5, show_if: early_close, help: "a picture that hasn't moved for this long is the end card (0: don't use this sign)"}
  min_watch_s: {default: 15, show_if: early_close, help: "never take a still picture for the end card before this long into a commercial"}
# what it does, in order, for the app's "How it works" ({option} = the option's value; run: opens up that macro)
how:
  - "No commercial starts and the game's own screen stays {no_ad_s} s: stop (the caller opens the chest)"
  - "Let the commercial play; after {ad_wait_s} s, or once it says \"Reward granted\", press Back to close it"
  - if: early_close
    then: ["Close it sooner once it shows it is over: its progress bar full, its countdown done, or its end card still for {still_s} s (after {min_watch_s} s)"]
  - "Still on: press Back again every {retry_s} s (at most {max_backs} Backs). One button can play 1-3 commercials in a row: each is watched"
  - "A commercial that opens Google Play: press Back to close it, nothing in Play is tapped (at most {max_play} times)"
  - "A commercial with no close button after {leave_after} Backs: leave it with Home and go back to the game; still there, force-close the game"
  - "Tap OK on the reward dialog (premium: close the thank-you instead) and stop"
  - "Or stop once the field has been back for {field_s} s (the commercials are over)"
screens: [premium_thanks, ad_reward, reward_confirm, ok_dialog, close_app, field]
unknown_timeout_s: 300

setup:
  - set: {since: now(), backs: 0, tries: 0, last_back: 0, granted: false, ads: 1, field_since: 0, ad_seen: false, gone_since: 0, plays: 0, play_back: 0, leaves: 0, started: now()}
  - set: {left: -1, still: 0, early_on: true, early_backs: 0, warned: false, bar_told: false}
  - status: "watching the commercial (closing it after {ad_wait_s}s)"

handlers:
  premium_thanks:   # premium subscribers: a thank-you instead of the commercial
    - count: premium_skips
    - tap: dialog_close_button
    - wait: 2
    - stop: "premium: no commercial"

  ad_reward:        # "Thank you for watching" (the reward goes to the inbox)
    - count: ad_rewards
    - status: "commercial watched: {screen_text(0.25, 0.8)}"
    - tap: dialog_ok_button
    - wait: 1.5
    - stop: rewarded

  reward_confirm:   # "Rewards received: ..."
    - count: ad_rewards
    - status: "commercial watched: {screen_text(0.25, 0.8)}"
    - tap: confirm_ok_button
    - wait: 1.5
    - stop: rewarded

  ok_dialog:        # "Thank you for watching. You have been rewarded ..."
    - count: ad_rewards
    - status: "commercial watched: {screen_text(0.25, 0.8)}"
    - tap: dialog_ok_button
    - wait: 1.5
    - stop: rewarded

  close_app:        # a Back too many reached the field: keep the game open
    - tap: [0.412, 0.568]
    - wait: 1.5
    - stop: "back on the field"

  field:            # the commercials closed straight back to the game (or a pause inside a group)
    - if: field_since == 0
      then: [{set: {field_since: now()}}]
    - if: now() - field_since >= field_s
      then: [{stop: "back on the field"}]
    - wait: 1

unknown:
  - set: {field_since: 0}
  # the commercial opened a Google Play app sheet by itself: it is still behind it, so this is not
  # the end of the group. Back closes the sheet; never tap in Play (no installs, no purchases).
  # Play in front = not the commercial's activity, and the sheet says "Install" (the game's own
  # screens never do; a commercial's own end card does, but then the commercial is in front)
  - if: not ad_in_front() and text_has('install')
    then:
      - set: {ad_seen: true, gone_since: 0}
      - if: now() - play_back > 4
        then:
          - if: plays >= max_play
            then: [{stop: "the commercials kept opening Google Play ({plays} times): closed it, stopping"}]
          # the commercial is back behind it: the usual Back closes it a few seconds later
          - set: {plays: plays + 1, play_back: now(), since: now() - ad_wait_s + 5, tries: 0}
          - count: play_sheets_closed
          - log: "commercial {ads} opened a Google Play sheet: pressing Back to close it (nothing tapped in Play)"
          - status: "closing the Google Play sheet a commercial opened"
          - back: true
      - wait: 2
    else:
      # the app sees which activity is in front: a commercial is an activity of its own, so once
      # one was seen, the game's own activity back for a few seconds = the group is over (the
      # caller goes on: the chest, the shop, ...)
      - if: ad_in_front()
        then: [{set: {ad_seen: true, gone_since: 0}}]
      - if: ad_seen and not ad_in_front()
        then:
          - if: gone_since == 0
            then: [{set: {gone_since: now()}}]
          - if: now() - gone_since >= 3 and leaves > 0
            then: [{stop: "left a commercial that wouldn't close (no close button): the game is back ({ads} in this group)"}]
          - if: now() - gone_since >= 3
            then: [{stop: "the commercials are over ({ads} in this group)"}]
          - wait: 1
        else:
          # no commercial ever came up and the game's own screen is on (e.g. the chest straight
          # away): there was none; never press Back here, that would throw the chest away
          - if: not ad_seen and game_screen() and now() - started >= no_ad_s
            then: [{stop: "no commercial played: the game's screen is on"}]
          # a Back on "Reward granted" that left a commercial on screen: the next one of the group,
          # with its own timer
          - if: granted and now() - last_back > 4 and not text_has('reward granted')
            then:
              - set: {since: now(), tries: 0, granted: false, ads: ads + 1}
              - status: "watching commercial {ads} of this group"
          # the commercial's own signs that it is over: Back now instead of after ad_wait_s
          - if: early_close and ad_in_front() and not warned
            then:
              - set: {left: ad_left(), still: screen_still()}
              # "Close video? You will lose your reward": too early. Back answers it (keep watching);
              # from now on only the timer closes commercials here
              - if: ad_warning()
                then:
                  - set: {warned: true, last_back: now()}
                  - count: ad_early_warnings
                  - log: "commercial {ads} warned it would lose the reward: pressing Back to keep watching (no more early closing)"
                  - back: true
                  - wait: 2
              - if: left > 0 and not bar_told
                then:
                  - set: {bar_told: true}
                  - log: "commercial {ads} shows how long it has left: closing it once it is over"
              # over, then moving again (the next commercial of a group): it may be closed early too
              - if: not early_on and left != 0 and still < 1
                then: [{set: {early_on: true, bar_told: false}}]
              - if: not warned and early_on and early_backs < 6 and now() - last_back > 4 and (left == 0 or (still_s > 0 and now() - since >= min_watch_s and still >= still_s))
                then:
                  - set: {early_on: false, early_backs: early_backs + 1, last_back: now()}
                  - count: ad_early_backs
                  - if: left == 0
                    then: [{log: "commercial {ads} is over (its progress bar or countdown says so): pressing Back"}]
                    else: [{log: "commercial {ads} looks over (its picture has been still {still_s}s): pressing Back"}]
                  - back: true
                  - wait: 2
          # Backs don't close it (a playable commercial with no X): leave it, Home then the game's own
          # screen; the branch above ends the group once the game is back
          # (once left, a commercial still on later is not given more Backs)
          - if: (tries >= leave_after and now() - last_back > 5) or (leaves >= 1 and now() - since > 20)
            then:
              # left once and it is still (or again) on: force-close the game, the caller starts it again
              - if: leaves >= 1
                then:
                  - count: games_force_closed
                  - log: "commercial {ads} is still on after leaving it: force-closing the game from recent apps"
                  - status: "force-closing the game: a commercial won't close"
                  - force_close: true
                  - if: not closed
                    then: [{stop: "a commercial did not close, and the game could not be force-closed from recent apps"}]
                  - stop: "force-closed the game, a commercial did not close"
              - set: {leaves: leaves + 1, tries: 0, since: now(), last_back: now(), granted: false}
              - count: ads_left
              - log: "commercial {ads} didn't close after {leave_after} Backs (no close button): leaving it (Home, then the game)"
              - status: "leaving a commercial that won't close"
              - leave_ad: true
          # the commercial is playing: let it run, then Back closes it; never tap inside it.
          # "Reward granted" (top right) = it counted: close it now instead of waiting ad_wait_s
          - if: now() - last_back > 5 and text_has('reward granted')
            then:
              - if: backs >= max_backs
                then: [{stop: "the commercials didn't close after {backs} Backs"}]
              - set: {backs: backs + 1, tries: tries + 1, last_back: now(), granted: true}
              - count: ad_backs
              - log: "commercial {ads} says reward granted: pressing Back ({backs}/{max_backs})"
              - back: true
              - wait: 2
          - if: now() - since > ad_wait_s + tries * retry_s
            then:
              - if: backs >= max_backs
                then: [{stop: "the commercials didn't close after {backs} Backs"}]
              - set: {backs: backs + 1, tries: tries + 1, last_back: now()}
              - count: ad_backs
              - log: "commercial {ads} is still on after {ad_wait_s + (tries - 1) * retry_s}s: pressing Back ({backs}/{max_backs})"
              - back: true
          - wait: 2
