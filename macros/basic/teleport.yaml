# Basic macro: travel by the World Map. Open the map, pick the era's tab (another continent first
# when that tab doesn't open from the continent in view), Expand → the continent, find the place's
# label (panning the map; opening the `area` label first when the place sits in its panel or
# mini map; else the map the tab shows, then every Expand entry), pick the
# destination in its panel if it opens one, Yes, and wait for the field (logic/Teleport.kt).
# Other macros run it for every trip: the cat scratchbook's cats and the dungeon macros' way to
# the Spacetime Rift (`run: {macro: teleport, params: {era: "'Present'", place: "'Baruoki'"}}`
# from YAML, Teleport.via from code). Start it on the field; it ends on the field at the place.
name: teleport
group: basic
icon: sun
description: "Basic: travel by the World Map to a place (era, continent, place, destination), then stop on the field there. Every trip of the other macros goes through it."
params:
  mode: {default: travel, choices: [travel, map_places], help: "travel = go to the place below; map_places = no trip: sweep every era's maps and remember where each place label is (the options below aren't used)"}
  era: {default: Present, choices: [Antiquity, Present, Future, "???"], help: "the World Map's era tab"}
  continent: {default: "", help: "the Expand list's entry to open (e.g. Migleina Continent, Illusion World); empty = the one remembered for the place, else the map the tab shows, then every entry"}
  place: {default: Baruoki, help: "the place's label on the World Map"}
  area: {default: "", help: "a label on the map that opens a panel or mini map holding the place (e.g. an island); empty = none, or the island the place is known to be on"}
  destination: {default: "", help: "the entry to pick when the place's label opens a list of destinations; empty = none"}
# what it does, in order, for the app's "How it works" ({option} = the option's value)
how:
  - {teleport: true}
  - if: mode == 'map_places'
    then: ["Stop with how many places were found on how many maps"]
  - if: mode != 'map_places'
    then: ["Stop on the field at {place}"]
screens: [field]
unknown_timeout_s: 30

setup:
  - set: {result: "'none'"}

handlers:
  field:
    - teleport: true
    - stop: "{result}"

unknown:
  - if: not game_in_front()
    then: [{stop: the game is not in front}]
  - wait: 1
