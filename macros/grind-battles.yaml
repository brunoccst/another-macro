# Walk back and forth on the current map, fight every encounter, repeat.
name: grind-battles
group: farm
description: Walk back and forth on the current map, fight every encounter, repeat.
templates: [grind_battles]
params:
  battles: {default: 10, help: "stop after this many battles (0 = no limit)"}
  walk_ms: {default: 1500, help: "how long each walk in one direction lasts"}
  first_walk: {default: -1, choices: [-1, 1], help: "direction of the first walk: -1 = left, 1 = right"}
  stuck_walks: {default: 8, help: "stop if this many walks in a row leave the view unchanged (0 = never)"}
  # the four front-row characters, left to right; all auto = the battle's Auto button
  skill_1: {default: auto, choices: [auto, 1, 2, 3, 4], help: "front-row character 1: auto or skill 1-4"}
  skill_2: {default: auto, choices: [auto, 1, 2, 3, 4], help: "front-row character 2: auto or skill 1-4"}
  skill_3: {default: auto, choices: [auto, 1, 2, 3, 4], help: "front-row character 3: auto or skill 1-4"}
  skill_4: {default: auto, choices: [auto, 1, 2, 3, 4], help: "front-row character 4: auto or skill 1-4"}
screens: [title, defeat, battle_result, skill_list, battle_command, battle, field]

setup:
  - set: {dir: first_walk, walked: false, still: 0}

handlers:
  field:
    # stop if walking stopped changing the view (wedged against something)
    - if: walked and not view_moved()
      then:
        - set: {still: still + 1}
        - if: stuck_walks > 0 and still >= stuck_walks
          then: [{stop: "party seems stuck: {still} walks without the view changing"}]
      else:
        - set: {still: 0}
    - set: {walked: true}
    - walk: {dir: dir, ms: walk_ms}
    - set: {dir: -dir}

  # any battle screen: fight it to the end with the chosen skills (shared with the other fight macros)
  battle_command: &fight
    - fight: skill_
    - if: outcome == 'won'
      then:
        - set: {walked: false, still: 0}
        - reset_view: true
        - count: battles
        - if: battles > 0 and stats.battles >= battles
          then: [{stop: "{battles} battles done"}]
  skill_list: *fight
  battle: *fight
  battle_result: *fight

  title:
    - count: title_resumes
    - tap: [0.5, 0.75]
    - wait: 5

  defeat:
    - stop: party was defeated
