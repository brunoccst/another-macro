# The Shop's daily commercial: Menu → Shop → play button (top-left) → 10 free Chronos Stones.
# Only the play button, OK/Close of the reward dialogs and the shop's X are ever tapped:
# nothing in the shop itself is touched, so nothing can be bought.
name: shop-ad
group: daily
icon: chest
description: "Watch the Shop's daily commercial (Menu → Shop → play button) for 10 Chronos Stones."
templates: [start_game, daily_ads, shop_ad]
params:
  ad_wait_s: {default: 45, help: "how long to let a commercial play before pressing back to close it"}
screens: [premium_thanks, shop_ok_dialog, shop, menu_open, field]
unknown_timeout_s: 120

setup:
  - set: {watching_since: 0, done: false, menu_taps: 0}

handlers:
  shop:
    - set: {watching_since: 0}
    - if: done or not found('shop_watch_button')
      then:
        - tap: shop_close_button
        - wait: 2
        - set: {done: true}
      else:
        - count: ads_started
        - tap: shop_watch_button
        - set: {watching_since: now()}
        - wait: 3

  premium_thanks:   # subscribers: no commercial
    - count: premium_skips
    - tap: dialog_close_button
    - set: {watching_since: 0}
    - wait: 2

  shop_ok_dialog:   # "Thank you for watching. You have been rewarded 10 Chronos Stones."
    - count: rewards
    - tap: dialog_ok_button
    - set: {done: true}
    - wait: 2

  menu_open:
    - if: done
      then:
        - back: true
        - wait: 1.5
        - stop: "{pick(1 + stats.rewards, 'the shop commercial was already watched today', 'shop commercial watched: +10 Chronos Stones')}"
    - set: {menu_taps: menu_taps + 1}
    - if: menu_taps > 4
      then: [{stop: "the Shop button didn't open the shop"}]
    - tap: menu_shop_button
    - wait: 3

  field:
    - if: done
      then: [{stop: "{pick(1 + stats.rewards, 'the shop commercial was already watched today', 'shop commercial watched: +10 Chronos Stones')}"}]
    - tap: field_menu_button
    - wait: 2

unknown:
  - if: not game_in_front()
    then: [{stop: "the game is not in front (open it first, e.g. with start-game)"}]
  - if: watching_since > 0 and now() - watching_since > ad_wait_s
    then:
      # a commercial is playing: let it finish, then back closes it; never tap inside it
      - back: true
      - count: ad_backs
      - set: {watching_since: now() - ad_wait_s + 10}
  - wait: 2
