# Claim the inbox: Menu → Inbox, open every item not opened yet (that receives its rewards), OK.
# The game has no "receive all" button and keeps opened items in the list for 90 days (marked
# "Opened"). When the inbox opens, the items not opened yet come first. So the macro opens the
# top-most row without the "Opened" mark until the page has none, then closes and reopens the
# inbox to bring the rest to the top; it is done when a freshly opened inbox starts with an opened
# item. Only rows, OK and the inbox's X are tapped: nothing is bought or spent.
name: inbox
group: daily
icon: chest
description: "Claim every reward in the inbox (Menu → Inbox, open each item not opened yet)."
templates: [daily_ads, inbox]
params:
  max_items: {default: 100, help: "open at most this many items in one run"}
# what it does, in order, for the app's "How it works" ({option} = the option's value; run: opens up that macro)
how:
  - {run: open-menu-page, params: {page: "'inbox'"}, text: "Open Menu → Inbox, starting the game if needed"}
  - "Wait for the list (and out the \"Connecting...\" overlay)"
  - "Tap the top-most item not marked \"Opened\", then OK on its rewards (noted for the outcome message)"
  - "Again until the page has none left; if any were opened, close and reopen the inbox to bring the rest to the top"
  - "Done when a freshly opened inbox starts with an opened item, or after {max_items} items: close the inbox and the menu and stop"
screens: [inbox_item, inbox, menu_open, field]
unknown_timeout_s: 45

setup:
  - set: {done: false, game_starts: 0, misses: 0, this_visit: 0, checks: 0, empty_looks: 0, connecting_looks: 0}

handlers:
  inbox_item:   # an opened item: "The items below have been received" + the rewards, OK
    - count: items_opened
    - log: "inbox item {stats.items_opened}: {screen_text(0.08, 0.75)}"
    - got: "{screen_text(0.08, 0.75)}"   # the rewards it lists, for the outcome message
    - tap: inbox_ok_button
    - set: {misses: 0, this_visit: this_visit + 1, checks: 0, empty_looks: 0}
    - wait: 1

  inbox:
    # Opening an item asks the game server first: a dimmed "Connecting..." overlay covers the
    # list for a few seconds, and the list (title, X, rows) still matches under it. That wait
    # must not count as a failed tap, or the macro gives up on the list and closes the inbox.
    # The rows also slide in after the title shows, so an empty look waits for them, and
    # "nothing to open" is only believed when a second look agrees.
    - if: text_has('connecting') and connecting_looks < 30
      then:
        - set: {connecting_looks: connecting_looks + 1}
        - status: "waiting for the game server (Connecting...)"
        - wait: 1
      else:
        - set: {connecting_looks: 0, row: "text_row_without('utc', 'opened', 0.15, 0.86)", listed: "text_has('utc')"}
        - if: not done and not listed and empty_looks < 4
          then:
            - set: {empty_looks: empty_looks + 1}
            - status: "waiting for the inbox list to show"
            - wait: 1.5
          else:
            - if: not done and row >= 0 and misses >= 3
              then: [{stop: "inbox: an item didn't open after 3 taps ({stats.items_opened} opened)"}]
            - if: not done and stats.items_opened < max_items and row >= 0
              then:
                - status: "opening inbox item {stats.items_opened + 1}"
                - tap: {x: 0.5, y: row}
                - set: {misses: misses + 1, checks: 0}   # misses back to 0 once the item shows
                - wait: 2.5
              else:
                - if: not done and checks < 1 and stats.items_opened < max_items
                  then:
                    - set: {checks: checks + 1}
                    - status: "checking the inbox list again"
                    - wait: 1.5
                  else:
                    # nothing new on this page. If items were opened in this visit, more may wait
                    # below: reopening the inbox brings them to the top. Otherwise it is done.
                    - if: this_visit == 0 or stats.items_opened >= max_items
                      then:
                        - log: "inbox list: {screen_text(0.15, 0.86)}"
                        - set: {done: true}
                        - status: "closing the inbox"
                      else:
                        - status: "reopening the inbox for the items further down"
                    - set: {this_visit: 0, misses: 0, checks: 0, empty_looks: 0}
                    - tap: inbox_close_button
                    - wait: 1.5

  # Menu → Inbox (also to reopen it): the basic macro open-menu-page (it opens the menu from the
  # field, and the game first if it isn't open)
  menu_open:
    - if: done
      then:
        - back: true
        - wait: 1.5
        - stop: "inbox: {stats.items_opened} item(s) opened"
    - run: {macro: open-menu-page, params: {page: "'inbox'"}}
    - if: result != 'inbox open'
      then: [{stop: "{result}"}]

  field:
    - if: done
      then: [{stop: "inbox: {stats.items_opened} item(s) opened"}]
    - run: {macro: open-menu-page, params: {page: "'inbox'"}}
    - if: result != 'inbox open'
      then: [{stop: "{result}"}]

unknown:
  # the game isn't open: open-menu-page starts it (once) and goes back to the inbox
  - if: not game_in_front()
    then:
      - if: done or game_starts > 0
        then: [{stop: "the game is not in front"}]
      - set: {game_starts: game_starts + 1}
      - run: {macro: open-menu-page, params: {page: "'inbox'"}}
      - if: result != 'inbox open'
        then: [{stop: "{result}"}]
    else:
      - wait: 1.5
