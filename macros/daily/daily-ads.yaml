# The 5 daily commercials: Menu → video icon (top) → Watch Video, until the counter reads 0/5.
# Each commercial is the basic macro watch-ad (watch it, close it, take the reward); this one
# opens the ad chest, taps Watch Video and taps through the chest that follows.
# Premium subscribers get a thank-you instead of the commercial; the chest opens either way.
name: daily-ads
group: daily
icon: chest
description: "Watch the 5 daily commercials (Menu → video icon) for the random chest."
templates: [start_game, daily_ads]
params:
  ad_wait_s: {default: 45, help: "how long to let a commercial play before pressing back to close it"}
  max_ads: {default: 5, help: "stop after this many"}
screens: [premium_thanks, ad_reward, reward_confirm, ok_dialog, ad_chest, menu_open, field]
unknown_timeout_s: 120

setup:
  - set: {menu_taps: 0}

handlers:
  ad_chest:
    # the button's counter shows how many are left today
    - if: text_has('0/5') or stats.ads_started >= max_ads
      then:
        - tap: ad_dont_watch_button
        - wait: 1.5
        - back: true
        - stop: "no commercials left today ({stats.ads_started} watched this run, {stats.rewards} rewards)"
    - count: ads_started
    - status: "commercial {stats.ads_started}/{max_ads}"
    - tap: ad_watch_button
    - wait: 3
    # the commercial and its reward dialog: the basic macro; then the chest opens here
    - run: {macro: watch-ad, params: {ad_wait_s: ad_wait_s}, until: [ad_chest, menu_open]}
    - log: "commercial {stats.ads_started}: {result}"

  # left over from a commercial watch-ad didn't see end
  premium_thanks:   # subscribers: no commercial, the chest still opens
    - count: premium_skips
    - status: "commercial {stats.ads_started}/{max_ads}: premium, no commercial; opening the chest"
    - tap: dialog_close_button
    - wait: 2

  ad_reward:
    - status: "commercial {stats.ads_started}/{max_ads}: done, opening the chest"
    - tap: dialog_ok_button
    - wait: 1.5

  ok_dialog:        # what the chest gave (or "could not receive ... reached the limit")
    - count: rewards
    - status: "chest {stats.rewards}: {screen_text(0.25, 0.8)}"
    - tap: dialog_ok_button
    - wait: 1.5

  reward_confirm:   # "Rewards received: 1 / Chronos Stone x5"
    - count: rewards
    - status: "chest {stats.rewards}: {screen_text(0.25, 0.8)}"
    - tap: confirm_ok_button
    - wait: 1.5

  menu_open:
    # the red "!" on the video icon is gone once all of today's commercials are used
    - if: not found('menu_ad_badge')
      then:
        - back: true
        - stop: "all of today's commercials are done ({stats.ads_started} watched this run, {stats.rewards} rewards)"
    - set: {menu_taps: menu_taps + 1}
    - status: "menu: opening the commercials (video icon)"
    - if: menu_taps > 4
      then: [{stop: "the video icon didn't open the ad chest (maybe no commercials today)"}]
    - tap: menu_ad_icon
    - wait: 2.5

  field:
    - status: "opening the menu"
    - tap: field_menu_button
    - wait: 2

unknown:
  - if: not game_in_front()
    then: [{stop: "the game is not in front (open it first, e.g. with start-game)"}]
  # the chest opening: tap through it
  - status: "opening the chest"
  - tap: [0.5, 0.65]
  - wait: 1.5
