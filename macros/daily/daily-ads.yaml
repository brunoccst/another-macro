# The 5 daily commercial groups: Menu → video icon (top) → Watch Video, until the counter reads 0/5.
# The counter counts groups: one Watch Video can play 1 to 3 commercials in a row (watch-ad
# watches the whole group).
# Each commercial is the basic macro watch-ad (watch it, close it, take the reward); this one
# reaches the ad chest (the basic macro open-menu-page), taps Watch Video and taps through the chest that follows.
# Premium subscribers get a thank-you instead of the commercial; the chest opens either way.
name: daily-ads
group: daily
icon: chest
description: "Watch the 5 daily commercial groups (Menu → video icon, 1-3 ads each) for the random chest."
templates: [start_game, daily_ads]
params:
  # how long a commercial plays etc.: the Watch Ad options (watch-ad.*), taken over from the basic macro
  max_ads: {default: 5, help: "stop after this many groups (Watch Video taps)"}
screens: [premium_thanks, ad_reward, reward_confirm, ok_dialog, ad_chest, menu_open, field]
unknown_timeout_s: 120

setup:
  - set: {game_starts: 0}

handlers:
  ad_chest:
    # the button's counter shows how many are left today
    - if: text_has('0/5') or stats.ads_started >= max_ads
      then:
        - tap: ad_dont_watch_button
        - wait: 1.5
        - back: true
        - stop: "no commercials left today ({stats.ads_started} watched this run, {stats.rewards} rewards)"
    - count: ads_started
    - status: "commercial {stats.ads_started}/{max_ads}"
    - tap: ad_watch_button
    - wait: 3
    # the commercial and its reward dialog: the basic macro; then the chest opens here
    - run: {macro: watch-ad, until: [ad_chest, menu_open]}
    - log: "commercial {stats.ads_started}: {result}"
    # watch-ad closed the game to get out of a commercial: starting it again is expected
    - if: result == 'closed the game, a commercial did not close'
      then: [{set: {game_starts: 0}}]

  # left over from a commercial watch-ad didn't see end
  premium_thanks:   # subscribers: no commercial, the chest still opens
    - count: premium_skips
    - status: "commercial {stats.ads_started}/{max_ads}: premium, no commercial; opening the chest"
    - tap: dialog_close_button
    - wait: 2

  ad_reward:
    - status: "commercial {stats.ads_started}/{max_ads}: done, opening the chest"
    - tap: dialog_ok_button
    - wait: 1.5

  ok_dialog:        # what the chest gave (or "could not receive ... reached the limit")
    - count: rewards
    - status: "chest {stats.rewards}: {screen_text(0.25, 0.8)}"
    - tap: dialog_ok_button
    - wait: 1.5

  reward_confirm:   # "Rewards received: 1 / Chronos Stone x5"
    - count: rewards
    - status: "chest {stats.rewards}: {screen_text(0.25, 0.8)}"
    - tap: confirm_ok_button
    - wait: 1.5

  # Menu → video icon: the basic macro open-menu-page (it opens the menu from the field, and the
  # game first if it isn't open); it says so when the video icon's red "!" is gone (all done today)
  menu_open:
    - run: {macro: open-menu-page, params: {page: "'ads'"}}
    - if: result == 'no commercials left today'
      then: [{stop: "all of today's commercials are done ({stats.ads_started} watched this run, {stats.rewards} rewards)"}]
    - if: result != 'ads open'
      then: [{stop: "{result}"}]

  field:
    - run: {macro: open-menu-page, params: {page: "'ads'"}}
    - if: result == 'no commercials left today'
      then: [{stop: "all of today's commercials are done ({stats.ads_started} watched this run, {stats.rewards} rewards)"}]
    - if: result != 'ads open'
      then: [{stop: "{result}"}]

unknown:
  # a commercial still in front (watch-ad gave up on it, or it came back; portrait ones too): never
  # tap it (that plays it). Leave it once (Home, then the game); still there the next time: close
  # the game from recent apps (the game is then started again)
  - if: ad_in_front()
    then:
      - if: stats.ads_left_here >= 2
        then: [{stop: "a commercial did not close, even after closing the game"}]
      - count: ads_left_here
      - if: stats.ads_left_here == 1
        then:
          - status: "leaving a commercial that won't close"
          - leave_ad: true
        else:
          - status: "closing the game: a commercial won't close"
          - close_game: true
    else:
      # the game isn't open: open-menu-page starts it (once) and goes back to the commercials
      - if: not game_in_front()
        then:
          - if: game_starts > 0
            then: [{stop: "the game is not in front"}]
          - set: {game_starts: game_starts + 1}
          - run: {macro: open-menu-page, params: {page: "'ads'"}}
          - if: result != 'ads open'
            then: [{stop: "{result}"}]
        else:
          # the chest opening: tap through it
          - status: "opening the chest"
          - tap: [0.5, 0.65]
          - wait: 1.5
