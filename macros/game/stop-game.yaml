# Turn the game off: back on the field opens "Close the app?", Yes closes it.
# Getting to the field first is the basic macro back-to-field.
name: stop-game
group: game
description: "Turn the game off (back → 'Close the app?' → Yes)."
screens: [close_app, field]
unknown_timeout_s: 60

setup:
  - set: {confirmed: false}

handlers:
  close_app:
    - count: confirms
    - status: "'Close the app?': tapping Yes"
    - tap: [0.588, 0.568]
    - set: {confirmed: true}
    - wait: 3
  field:
    - status: "on the field: pressing back to close the game"
    - back: true
    - wait: 1.5

unknown:
  # the game is landscape-only: a portrait app in front means it's gone
  - if: not game_in_front()
    then:
      - if: confirmed
        then: [{stop: the game is off}]
        else: [{stop: the game is not in front}]
  - run: back-to-field
  - if: result != 'on the field' and result != 'the game is not in front'
    then: [{stop: "could not reach the field to close the game ({result})"}]
