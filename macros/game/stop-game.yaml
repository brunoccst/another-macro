# Turn the game off: back on the field opens "Close the app?", Yes closes it.
# Getting to the field first is the basic macro back-to-field.
name: stop-game
group: game
description: "Turn the game off (back → 'Close the app?' → Yes)."
# what it does, in order, for the app's "How it works" ({option} = the option's value; run: opens up that macro)
how:
  - {run: back-to-field, text: "Back to the field (Back until it shows)"}
  - "On the field press Back: the game asks \"Close the app?\""
  - "Tap Yes and stop once the game is off"
screens: [close_app, field]
unknown_timeout_s: 60

setup:
  - set: {confirmed: false}

handlers:
  close_app:
    - count: confirms
    - status: "'Close the app?': tapping Yes"
    - tap: [0.588, 0.568]
    - set: {confirmed: true}
    - wait: 3
  field:
    - status: "on the field: pressing back to close the game"
    - back: true
    - wait: 1.5

unknown:
  # after Yes the game is closing: whatever shows now (a fade, the home screen, another app)
  # is not the game, so never press Back into it
  - if: confirmed
    then: [{wait: 2}, {stop: the game is off}]
  # the game is landscape-only: a portrait app in front means it's gone
  - if: not game_in_front()
    then:
      - stop: the game is not in front
  - run: back-to-field
  - if: result != 'on the field' and result != 'the game is not in front'
    then: [{stop: "could not reach the field to close the game ({result})"}]
