# Turn the game on, always watch the daily login-bonus ad, stop on the field.
# The ad itself is the basic macro watch-ad (watch it, close it, take the reward). With watch_ad on
# this macro never taps Don't Watch (skipping loses the day's ad) and never waits without a limit:
# a commercial that won't close is retried (up to 3 tries), then the run fails as "login ad not watched".
name: start-game
group: game
description: Turn the game on, always watch the daily login-bonus ad, stop on the field.
templates: [start_game, daily_ads]
params:
  watch_ad: {default: true, help: "take the daily login-bonus ad; false = just open the game"}
  wifi_only: {default: true, help: "let the game download its update data only on Wi-Fi; false = on mobile data too"}
  # how long a commercial plays etc.: the Watch Ad options (watch-ad.*), taken over from the basic macro
# what it does, in order, for the app's "How it works" ({option} = the option's value; run: opens up that macro)
how:
  - "Open the game"
  - "Title screen: wait for Continue (the game's server) and tap it"
  - "The game asks to download its update data: Yes on Wi-Fi, else stop and say so (option wifi_only)"
  - "While it downloads (\"Confirming Updates\"): wait"
  - "Tap through the loading screens and the login bonus"
  - "A popup the taps don't close (e.g. a notice when the game stayed open over the daily reset): press Back; if that asks \"Close the app?\", tap No"
  - if: watch_ad
    then:
      - "The daily login-bonus ad: tap Watch Video"
      - {run: watch-ad, text: "Watch the commercial, close it and take the reward"}
      - "A commercial that won't close: leave it, then force-close the game and start it again and tap Watch Video again (up to 3 tries, then fail: login ad not watched)"
    else:
      - "Don't watch the login-bonus ad: tap Don't Watch and stop as soon as the game is open"
  - "Stop on the field"
screens: [ad_reward, premium_thanks, ad_offer, close_app, field, game_data_update, title]
unknown_timeout_s: 180
# loop guard: the title screen comes back once after a download or a restart; more is a loop
max_visits: {title: 4}

setup:
  - set: {continued: false, left_once: false, ad_tries: 0, ad_waits: 0, taps: 0}
  - status: opening the game
  - launch: "'games.wfs.anothereden'"
  - count: launches
  - wait: 3

handlers:
  game_data_update:   # the game downloads its data: as long as it takes
    - status: "the game is downloading its update data: waiting"
    - wait: 5

  title:
    # "Continue" only shows once the game has reached its server
    - if: found('title_continue')
      then:
        - status: "title screen: tapping Continue"
        - count: continue_taps
        - set: {continued: true, taps: 0}
        - tap: [0.5, 0.75]
        - wait: 8
      else:
        - status: "title screen: waiting for the game's server"
        - wait: 2

  ad_offer:
    - if: not watch_ad
      then:
        # watch_ad off: Don't Watch, then on to the field; if its button isn't found, stop with the game open
        - if: found('ad_dont_watch_button')
          then:
            - count: ads_declined
            - status: "login-bonus ad: Don't Watch (option watch_ad is off)"
            - tap: ad_dont_watch_button
            - wait: 2
          else:
            - set: {ad_waits: ad_waits + 1}
            - if: ad_waits >= 10
              then: [{stop: "the game is open (daily ad not checked)"}]
            - wait: 1
      else:
        # the popup fades in: its header shows before its buttons, so wait (a limited time) for the button to tap
        - if: found('watch_video_button')
          then:
            - count: ads_accepted
            - set: {ad_waits: 0}
            - status: "login-bonus ad"
            - tap: watch_video_button
            - wait: 3
            - run: {macro: watch-ad, until: [field, ad_offer]}
            - log: "login-bonus ad: {result}"
            # watch-ad closed the game to get out of a commercial: start it again and take the ad again
            - if: result == 'force-closed the game, a commercial did not close'
              then:
                - set: {ad_tries: ad_tries + 1}
                - if: ad_tries >= 3
                  then: [{stop: "failed: login ad not watched (a commercial did not close, {ad_tries} tries)"}]
                - launch: "'games.wfs.anothereden'"
                - wait: 3
          else:
            - set: {ad_waits: ad_waits + 1}
            - status: "login-bonus ad: waiting for its buttons"
            - if: ad_waits >= 60
              then: [{stop: "failed: login ad not watched (its Watch Video button never showed)"}]
            - wait: 1

  premium_thanks:   # premium subscribers get this instead of an ad
    - if: not watch_ad
      then: [{stop: "the game is open (daily ad not checked)"}]
    - count: premium_skips
    - status: "premium: no login-bonus ad, closing the thank-you"
    - tap: dialog_close_button
    - wait: 2

  ad_reward:         # left over from an ad watch-ad didn't see end
    - count: ad_rewards
    - status: "login-bonus ad watched, reward: {screen_text(0.25, 0.8)}"
    - tap: dialog_ok_button
    - wait: 2

  close_app:         # a Back below reached the field: keep the game open (No)
    - count: close_app_no
    - tap: [0.412, 0.568]
    - wait: 1.5

  field:
    - stop: "the game is on and on the field ({pick(1 + stats.ad_rewards + 2 * stats.premium_skips, 'no login-bonus ad seen', 'login-bonus ad watched', 'premium: no ad')})"

unknown:
  # a commercial still in front (watch-ad gave up on it, or it came back; portrait ones too): never
  # tap it (that plays it). Leave it once (Home, then the game); still there the next time: close
  # the game from recent apps (the game is then started again and Watch Video is tapped again).
  # Up to 3 tries, then fail: the ad must be watched, never skipped
  - if: ad_in_front()
    then:
      - if: ad_tries >= 3
        then: [{stop: "failed: login ad not watched (a commercial did not close, even after force-closing the game)"}]
      - count: ads_left_here
      - if: left_once
        then:
          - set: {ad_tries: ad_tries + 1, left_once: false}
          - status: "force-closing the game: a commercial won't close"
          - force_close: true
        else:
          - set: {left_once: true}
          - status: "leaving a commercial that won't close"
          - leave_ad: true
    else:
      # "Confirming Downloaded Data: Do you wish to download the required data? ... Download Size:
      # ..." (a game update): Yes on Wi-Fi (or always, wifi_only off), else stop and say so.
      # No/Back only brings the same question back from the title screen.
      - if: text_has('download the required data')
        then:
          - if: wifi_only and not on_wifi()
            then: [{stop: "failed: the game wants to download its update data and the phone isn't on Wi-Fi ({screen_text(0.4, 0.6)}): start the game on Wi-Fi, or turn wifi_only off"}]
          - count: data_downloads
          - status: "the game asks to download its update data: Yes"
          - log: "update data: {screen_text(0.4, 0.6)}"
          - tap: [0.588, 0.638]
          - set: {taps: 0}
          - wait: 3
        else:
          - if: not watch_ad
            then:
              - if: continued and game_in_front()
                then: [{stop: "the game is open (daily ad not checked)"}]
              - wait: 2
            else:
              - if: not game_in_front()
                then:
                  - status: "the game isn't in front: opening it again"
                  - launch: "'games.wfs.anothereden'"
                  - wait: 3
                else:
                  # loading screens and the login bonus. A popup that ignores taps is closed with Back: after 8 taps that changed nothing once the ad was taken, Back
                  # (25 before it: a cold start's loading screens can take ~40 s of taps)
                  - set: {taps: taps + 1}
                  - if: taps >= 25 or (stats.ads_accepted > 0 and taps >= 8)
                    then:
                      - count: popup_backs
                      - status: "a popup the taps don't close: pressing Back"
                      - set: {taps: 0}
                      - back: true
                      - wait: 1.5
                    else:
                      - status: "loading (tapping through the login bonus)"
                      - tap: [0.5, 0.3]
                      - wait: 1.5
