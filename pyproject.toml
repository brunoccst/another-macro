[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "another-macro"
version = "0.1.0"
description = "Screen-reading macro framework for playing Another Eden on a phone (ADB) or other devices."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
# numpy/OpenCV are an extra because on the phone (Termux) they come from
# `pkg install opencv-python`, not from pip — see docs/setup-android.md
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
cv = ["numpy>=1.24", "opencv-python-headless>=4.8"]
dev = ["numpy>=1.24", "opencv-python-headless>=4.8", "pytest>=7"]

[project.scripts]
another-macro = "another_macro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
another_macro = ["assets/templates/*", "scenarios/*/templates/*", "scenarios/*/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
