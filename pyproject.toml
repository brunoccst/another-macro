[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "another-macro"
version = "0.1.0"
description = "Data tools for the Another Macro app: macro pack builder and route planners."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
# OpenCV only for tests (image size guard) and cutting template crops
dev = ["numpy>=1.24", "opencv-python-headless>=4.8", "pytest>=7"]

[project.scripts]
another-macro = "another_macro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
another_macro = ["assets/templates/*", "scenarios/*/templates/*", "scenarios/*/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
