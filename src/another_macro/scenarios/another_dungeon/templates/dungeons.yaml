# The Another Dungeons the another_dungeon action (AnotherDungeon.kt) runs: each map's layout
# and the fixed walk through it. Game knowledge and mapping notes are not kept here: see
# docs/knowledge-base/ (learned/dungeons/<dungeon>.md: found on the phone; external/: wiki facts).
#
# Positions are fractions of the screen as the opened area map shows them:
#   segs:     streets, [y, x_from, x_to]
#   links:    stairs between two streets, [x, y_from, y_to] (the run flicks to take them)
#   chests:   [x, y] of each chest (the run opens the "!" bubble that shows close by)
#   arrival:  [x, y] where the party comes in (the run lines the map up from it)
#   exit:     [x, y] where the way on to the next map is
#   sparkles / fish / jars: [x, y] of other stops, planned with the chests in one order
#   path:     generated by `another-macro dungeon-routes --write` (don't edit by hand: change the
#             layout or walk.yaml and run it again). One leg per stop: "R 1180" / "L 2950" = hold
#             right/left that many ms from rest (walk.yaml turns time into distance), "U" / "D" =
#             flick up/down at the stairs. The run follows it without opening the area map.
# names: the area names the run matches in the map's title; one entry covers a map and its
# rare variant. boss: the boss's name (the run tells the boss battle by it); boss: true = the
# boss map. enemies: false = the run doesn't clear the map's enemies first.
# steps: fixed moves for a map without a layout: "bubble" (open the "!" here), "U"/"D" (flick),
# "L 1000"/"R 1000" (hold), "chest L" (walk until a chest's "!" shows), "boss L" (walk until the
# boss's question shows), "gate" (a "!" that asks to travel on: Yes), "yes" (Yes to a travel question).
# area_map_scrolls: each look at the area map lines the layout up again.
# camera_lags: the run doesn't count a still first second of a walk as a late start.
# requires: characters the game asks for in the party; the run's stop names a missing one.
# chests_count: chests on a map without a layout. sparkle_icons: read the sparkles' spots off the
# area map. exit_walk: the way on is walking off the screen's edge at `exit` (no sign).
# exit_sign: only this sign template counts as the exit.
# key_cost: keys one run takes. area_of: another chest area of that dungeon (the macro's area option).
