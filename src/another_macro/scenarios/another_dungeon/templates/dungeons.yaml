# Another Dungeons the another_dungeon action knows (source: anothereden.wiki, data only).
#
# The area map only shows what the party has already walked, so each map's layout is
# given here, measured from the wiki's minimaps and checked on a 2400x1080 phone. All
# positions are fractions of the screen as the opened area map shows them:
#   segs:   streets, [y, x_from, x_to]
#   links:  stairs/arrows between two streets, [x, y_from, y_to] (a quick flick takes them)
#   chests: [x, y] of each treasure chest (a "!" bubble shows over it when the party is close)
#   arrival: [x, y] where the party comes in (the map is lined up from it: the game draws each
#            map a little left or right, so the measured offset there shifts the whole layout)
#   exit:   [x, y] where the way down to the next map is (a "bars" sign on the ground; the
#           "steps" sign is the way back up)
#   path:   generated by `another-macro dungeon-routes --write` (don't edit by hand: change the
#           layout or walk.yaml and run it again). The fastest order through the chests to the
#           exit as fixed moves, one leg per stop: "R 1180" / "L 2950" = hold right/left that
#           many ms from rest (walk.yaml turns time into distance), "U" / "D" = flick up/down
#           at the stairs. The app follows it without opening the area map.
# names: the area names in the map's title ("Dogma Tower - Gloomy Corridor"); a rare
# variant of a map shares its layout. boss: the last map, where the boss waits.
dogma_tower:
  name: Dogma Tower
  era: Present
  boss: Ancient Sentry
  maps:
    - names: [Basement Entrance]
      # measured on the phone (the rest of the maps: wiki minimap, shifted by the same -0.005);
      # stairs bottom→middle taken at 0.382-0.395, middle→top-left at 0.353-0.360
      segs: [[0.363, 0.341, 0.395], [0.363, 0.484, 0.643], [0.497, 0.34, 0.66], [0.631, 0.374, 0.627]]
      links: [[0.356, 0.363, 0.497], [0.516, 0.363, 0.497], [0.580, 0.363, 0.497], [0.388, 0.497, 0.631], [0.451, 0.497, 0.631], [0.612, 0.497, 0.631]]
      chests: [[0.484, 0.363], [0.39, 0.363]]
      arrival: [0.5175, 0.631]
      exit: [0.643, 0.363]
      # generated by `another-macro dungeon-routes --write` (~36s of walking)
      path:
        - [chest 2, L 5250, U, L 1320, U, R 1970]
        - [chest 1, L 1620, D, R 6420, U, L 1660]
        - [exit, R 6690]
    - names: [Gloomy Corridor, Secluded Corridor]
      # lined up on the phone (arrival measured at 0.643)
      segs: [[0.363, 0.355, 0.59], [0.497, 0.321, 0.472], [0.497, 0.525, 0.643], [0.631, 0.358, 0.642]]
      links: [[0.378, 0.363, 0.497], [0.541, 0.363, 0.497], [0.431, 0.497, 0.631], [0.597, 0.497, 0.631]]
      # measured on the phone: middle-row up-stairs taken at 0.370-0.385, up-stairs bottom→middle at 0.428-0.434, down-stairs at 0.597, the chest at 0.372
      chests: [[0.372, 0.631]]
      arrival: [0.643, 0.497]
      exit: [0.423, 0.363]
      # generated by `another-macro dungeon-routes --write` (~25s of walking)
      path:
        - [chest 1, L 1920, D, L 8920]
        - [exit, R 2480, U, L 2230, U, R 1880]
    - names: [Desolate Space, Remote Space]
      # lined up on the phone (arrival measured at 0.436); the bottom street is split in two
      segs: [[0.363, 0.333, 0.636], [0.497, 0.351, 0.501], [0.497, 0.554, 0.656], [0.631, 0.367, 0.481], [0.631, 0.548, 0.636]]
      links: [[0.366, 0.363, 0.497], [0.485, 0.363, 0.497], [0.57, 0.363, 0.497], [0.4, 0.497, 0.631], [0.600, 0.497, 0.631]]
      chests: [[0.636, 0.363], [0.559, 0.631], [0.478, 0.631]]
      arrival: [0.436, 0.497]
      exit: [0.654, 0.497]
      # generated by `another-macro dungeon-routes --write` (~46s of walking)
      path:
        - [chest 3, L 1490, D, R 3690]
        - [chest 1, L 3390, U, R 3540, U, R 6380]
        - [chest 2, L 2790, D, R 1240, D, L 2530]
        - [exit, R 2180, U, R 2700]
    - names: [Basement Mausoleum]
      boss: true
      chests_count: 1
burning_beast_kings_castle:
  name: Burning Beast King's Castle
  era: Present
  # on the Present map, "Parallel Time Layer" opens a smaller map with the castle; its label wraps
  area: Parallel Time Layer
  label: Burning Beast King's
  boss: ""
  # the wiki minimaps (2160x1080) line up with the phone's area map with no offset:
  # x = (x_wiki + 120) / 2400, y = y_wiki / 1080. Checked on the phone 2026-11-08: map 1 right
  # wall 0.610, stairs 0.540 and 0.476; map 2 arrival 0.579, stairs 0.532/0.628/0.405/0.372,
  # chest taken at 0.382 (left wall); map 3 arrival 0.388.
  # The way to the next map is a grand staircase in the background with a round door sign
  # (template door_sign): tap it. The party arrives in front of the next map's foreground door.
  maps:
    - names: [Beast King's Castle Front Guard Tower]
      segs: [[0.363, 0.384, 0.513], [0.363, 0.55, 0.641], [0.497, 0.359, 0.625], [0.631, 0.359, 0.459], [0.631, 0.502, 0.609]]
      links: [[0.412, 0.363, 0.497], [0.476, 0.363, 0.497], [0.570, 0.363, 0.497], [0.380, 0.497, 0.631], [0.540, 0.497, 0.631]]
      chests: [[0.386, 0.363], [0.457, 0.631]]
      arrival: [0.586, 0.631]
      exit: [0.444, 0.363]
      # generated by `another-macro dungeon-routes --write` (~31s of walking)
      path:
        - [chest 2, L 1920, U, L 6420, D, R 3620]
        - [chest 1, L 3310, U, R 1320, U, L 1490]
        - [exit, R 2530]
    - names: [Beast King's Castle Watchtower, Beast King's Castle Watchtower Parapets]
      segs: [[0.363, 0.382, 0.601], [0.497, 0.351, 0.665], [0.631, 0.335, 0.42], [0.631, 0.479, 0.649]]
      links: [[0.405, 0.363, 0.497], [0.500, 0.363, 0.497], [0.581, 0.363, 0.497], [0.372, 0.497, 0.631], [0.532, 0.497, 0.631], [0.628, 0.497, 0.631]]
      chests: [[0.383, 0.363]]
      arrival: [0.579, 0.631]
      exit: [0.418, 0.631]
      # generated by `another-macro dungeon-routes --write` (~24s of walking)
