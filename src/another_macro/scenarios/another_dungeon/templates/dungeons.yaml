      links: [[0.383, 0.363, 0.497], [0.468, 0.363, 0.497], [0.581, 0.363, 0.497], [0.423, 0.497, 0.631], [0.516, 0.497, 0.631], [0.628, 0.497, 0.631]]
      chests: [[0.340, 0.363], [0.513, 0.363], [0.488, 0.631]]
      arrival: [0.388, 0.631]
      exit: [0.627, 0.363]
