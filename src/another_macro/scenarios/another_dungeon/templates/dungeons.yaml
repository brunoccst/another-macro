  name: Underworld
  # the "???" tab of the Another Dungeon map, its right-hand continent
  era: "???"
  # one run takes 2 green keys (Hard only)
  key_cost: 2
  # Demon's Den's boss (the other areas: Dimensional Cathedral - Haunted Queen Himika, Ark of the
  # Underworld - Dimensional Destroyer Himika, Mark of God's Tomb - Phantom Eden)
  boss: Titan Ogre
  # Mapped on the phone 2026-11-15 (Hard, Demon's Den). A run: Nazrik (a safe hub, no enemies; every few
  # runs a new merchant walks up and talks) → east off the screen into Zero Point (enemies, Horrors = the
  # red star icon, which moves; Sea-Drift sparkles whose spots change every run, shown as bag icons on the
  # area map) → the door sign at its lower-right end, "Go to Demon's Den? *You cannot return..." Yes →
  # Demon's Den (4 chests; the area map shows no chest icons) → the door sign at the west end of its
  # third street → the boss area (also titled "Demon's Den"): its chest to the right, the boss's question
  # to the left. Sea-Drifts are never spent by the macro (the user spends them).
  maps:
    - names: ["Nazrik, City of Shadows"]
