# Every Another Dungeon in the game (anothereden.wiki "Another Dungeon" page, saved 2026-11-08;
# data only). 80 dungeons, the ones with both difficulties listed once. This is the to-do list
# for one macro per dungeon; the maps and routes a macro walks go in dungeons.yaml (same id)
# once the dungeon is mapped (skill map-dungeon). See docs/dungeon-macros-plan.md.
#
#   kind:  standard = Spacetime Rift door → era tab → the dungeon's label;
#          otherlands / mysterious_vortex / kairos / sealed_realm = families with their own
#          entry and rules (to be learned per family when the first one is mapped)
#   era:   the era tab on the Another Dungeon map (none = not in an era tab)
#   hard / very_hard: recommended level and the enemies' element/weapon weaknesses,
#          resistances and absorptions (read from the wiki's icons: fire, earth, wind, water,
#          thunder, shade, crystal; slash/blunt/pierce; "varies" = mixed per map)
#   light_shadow: which points the completion's 3rd reward counts (light, shadow or both)
#   drops: tomes/psalms (and All Treatises/Codices/Opuses at 0.1% each) the dungeon drops
#   wiki:  the dungeon's own wiki page (map names, minimaps, chests, boss); the wiki blocks
#          automated fetches, so the user saves the page and uploads it
#   macro: the macros/dungeon/<name>.yaml that runs it, or todo
#
# Wiki notes for every dungeon: 1-2 key cards per run (green = Hard, red = Very Hard), 5 fights
# per map before "The enemy has disappeared..." (more in some: every 2x green key dungeon,
# Home's Lost Atelier, Toto Theater World), Very Hard unlocks after Chapter 25 and the Hard
# clear (side-story dungeons unlock with their story), 10% White Key chance per run.
