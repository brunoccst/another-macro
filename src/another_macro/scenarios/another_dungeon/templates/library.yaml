# Another Dungeon templates (captured on a 2400x1080 phone). The maps' layouts are in
# dungeons.yaml: the area map only shows the parts already walked.
templates:
  field_interact_bubble:
    notes: The "!" bubble over something the party can use when close (a chest of any look, the Another Dungeon door).
    file: field_interact_bubble.png
    ref: [2400, 1080]
    region: [0.05, 0.1, 0.9, 0.6]
    threshold: 0.8
    scales: [0.9, 1.0, 1.1, 1.2]   # the door's bubble is drawn ~10% larger than a chest's
  ground_arrow_bars:
    notes: Round sign (bars icon) on the ground at a staircase to another map; tap it to take it.
    file: ground_arrow_bars.png
    ref: [2400, 1080]
    region: [0.05, 0.15, 0.8, 0.8]
    threshold: 0.8
  ground_arrow_steps:
    notes: Round sign (steps icon) at a staircase/door to another map; tap it to take it.
    file: ground_arrow_steps.png
    ref: [2400, 1080]
    region: [0.05, 0.15, 0.8, 0.8]
    threshold: 0.8
