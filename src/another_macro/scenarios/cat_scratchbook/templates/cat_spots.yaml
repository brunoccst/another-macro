# Where each Cat Scratchbook cat is, and the fixed way there (cat-routes, see cat_routes.py).
# Keyed by the clue's `location` in riddles.yaml. Game data only (place names from the
# Another Eden Wiki's clue table); positions are measured on the phone, never from art.
#
#   era:        World Map era tab (Antiquity / Present / Future)
#   continent:  the entry to tap in the World Map's Expand list when the place isn't on the map
#               point zero shows (islands such as Snake Bone Island have their own entry);
#               null = no Expand needed
#   place:      the label to tap on that continent's map
#   walk_to:    the map the cat is on when it is next to the travel point (the clue says
#               "Enter from"): the party travels to `place` and walks across. Not routed yet.
#   sub:        the sub-location: the entry in the place's destination panel, if it has one
#   world_map:  from POINT ZERO (World Map, Present era, Baruoki's label dragged to (0.5, 0.55);
#               Baruoki is the first map, every account has it), then the era tab if not Present
#               and Expand -> continent if set: {pans: [[dx, dy], ...], tap: [x, y]}. Each pan
#               drags the map by that fraction of the screen (700 ms, from the middle), then the
#               place's label is tapped at [x, y]. The label is checked by OCR before the tap.
#   area:       on the opened area map (fractions of a 2400x1080 screen, as in dungeons.yaml):
#     segs:       streets [y, x_from, x_to];  links: stairs [x, y_from, y_to] (a flick takes them)
#     arrival:    [x, y] where the party stands after the trip
#     cat:        [x, y] where the cat starts
#     drift:      [left, right]: how far the cat wanders from its start along its street
#     walk_scale: this area map's zoom against Dogma Tower's (hold R 3000 from rest walks
#                 0.0709 there; walk_scale = distance here / 0.0709)
#   path:       generated by `another-macro cat-routes --write` (don't edit): the fixed moves
#               from arrival to the cat's start, "R 1180" / "L 2950" = hold right/left that many
#               ms from rest, "U" / "D" = flick at stairs (walk.yaml turns time into distance).
#
# A spot without a full `area` has no path: the app then finds its cat the old way (search the
# world map by OCR, steer by the feather icon on the area map). `another-macro cat-routes --todo`
# lists what each spot still needs.
