name: release
# Push a tag like v0.2.0 to publish the app, or run this workflow by hand on main with
# the version (it creates the tag): the signed APK is attached to a GitHub Release as
# another-macro.apk, which the app's updater picks up.
# Download link that always points at the newest version:
#   <this repository>/releases/latest/download/another-macro.apk
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create and publish, like v1.0.0"
        required: true
jobs:
  release:
    uses: brunoccst/macro-forge/.github/workflows/app-release.yml@main
    permissions:
      contents: write
    secrets: inherit
    with:
      version: ${{ inputs.version || github.ref_name }}
      apk_name: another-macro.apk
      app_name: Another Macro
