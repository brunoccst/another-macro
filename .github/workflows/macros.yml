name: macros
# The macro pack the Android app downloads (macros, templates, dungeon data), built by
# macro-forge's pack tool (core/tools/macroforge_pack.py). Every push that changes them publishes
# the pre-release "macros-<branch>"; phones following that branch install it by themselves.
on:
  push:
    paths:
      - "macros/**"
      - "game.yaml"
      - "src/another_macro/assets/templates/**"
      - "src/another_macro/scenarios/*/templates/**"
      - "src/another_macro/scenarios/*/*.yaml"
      - "core"
      - ".github/workflows/macros.yml"
  workflow_dispatch:
jobs:
  pack:
    uses: brunoccst/macro-forge/.github/workflows/macro-pack.yml@main
    permissions:
      contents: write
    with:
      app_name: Another Macro
