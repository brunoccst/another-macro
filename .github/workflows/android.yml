name: android
on:
  push:
    paths:
      - "android/**"
      - "core"
      - "core/**"
      - "game.yaml"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "core"
      - "core/**"
      - "game.yaml"
      - ".github/workflows/android.yml"
  workflow_dispatch:
jobs:
  # tests, the dev build and the logic pack, published as "dev-<branch>" (macro-forge's workflow)
  apk:
    uses: brunoccst/macro-forge/.github/workflows/app-build.yml@main
    permissions:
      contents: write
    secrets: inherit
    with:
      apk_name: another-macro.apk
      artifact: another-macro-apk
