name: android
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    # the dev build of each pushed branch is published as a pre-release the app can update from
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret not set: APK is signed with a throwaway debug key and cannot update an installed copy"
          fi
      - name: Unit tests (no device)
        run: gradle -p android testDebugUnitTest --stacktrace
      - name: Build debug APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_NAME: 0.0.${{ github.run_number }}-dev
          # the branch a dev build follows for its own updates (none for PR builds)
          BUILD_BRANCH: ${{ github.event_name != 'pull_request' && github.ref_name || '' }}
        run: |
          # minutes since 2025-01-01: every build is an upgrade of the one before (self-update)
          export VERSION_CODE=$(( ($(date +%s) - 1735689600) / 60 ))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          gradle -p android assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: another-macro-apk
          path: android/app/build/outputs/apk/debug/*.apk
      # The app's update_app tool (phone connector) installs these: one pre-release per branch,
      # "dev-<branch>", replaced on every push. Only signed builds (a throwaway key can't update).
      - name: Publish the dev build
        if: github.event_name != 'pull_request' && env.ANDROID_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          TAG="dev-$(echo "$BRANCH" | sed 's/[^A-Za-z0-9._-]/-/g')"
          cp android/app/build/outputs/apk/debug/*.apk another-macro.apk
          NOTES="Dev build of \`$BRANCH\` at ${GITHUB_SHA::7} (not a release).
          versionName: 0.0.${{ github.run_number }}-dev
          versionCode: $VERSION_CODE"
          gh release delete "$TAG" --cleanup-tag -y 2>/dev/null || true
          gh release create "$TAG" another-macro.apk --prerelease --target "$GITHUB_SHA" \
            --title "Dev build: $BRANCH" --notes "$NOTES"
