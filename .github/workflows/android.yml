name: android
on:
  push:
    paths:
      - "android/**"
      - "src/another_macro/assets/templates/**"
      - "src/another_macro/scenarios/*/templates/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret not set: APK is signed with a throwaway debug key and cannot update an installed copy"
          fi
      - name: Build debug APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                    VERSION_NAME: 0.0.${{ github.run_number }}-dev
        run: gradle -p android assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: another-macro-apk
          path: android/app/build/outputs/apk/debug/*.apk
