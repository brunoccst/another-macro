# Another Macro relay: macro-forge's relay (core/relay, see its README.md), for Cloudflare builds
# that run from this repo's root. The Worker keeps its name, so the relay address stays the same.
name = "another-macro"
main = "core/relay/src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "RELAY"
class_name = "PhoneRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PhoneRelay"]

[observability]
enabled = false
